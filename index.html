<style>
/* Layout: one column. A weekly gauge split into 7 days on top, then one segmented bar per goal. Bottom bar holds tabs and the log button. */
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --ink:#111214;
  --mute:#6B6C72;
  --line:#E3E3E8;
  --track:#E6E6EB;
  --accent:#0B7A69;
  --accent-ink:#FFFFFF;
  --plan:#BDE3DA;
  --alert:#C23B22;
  --f-display:ui-rounded,'SF Pro Rounded',-apple-system,'SF Arabic','Readex Pro',system-ui,sans-serif;
  --f-body:-apple-system,'SF Arabic','SF Pro Text',system-ui,'IBM Plex Sans Arabic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--mute:#98989F;--line:#2C2C2E;--track:#2C2C2E;--accent:#3FC4AC;--accent-ink:#06231D;--plan:#1D4A41;--alert:#FF8A66;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--mute:#98989F;--line:#2C2C2E;--track:#2C2C2E;--accent:#3FC4AC;--accent-ink:#06231D;--plan:#1D4A41;--alert:#FF8A66;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:14px 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:640px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}

<div id="app" dir="rtl" lang="ar"></div>
<nav class="bottom" dir="rtl" id="nav"></nav>
<div class="scrim" id="scrim" hidden dir="rtl"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden dir="rtl" role="status"></div>

<script>
(function(){
'use strict';
var WD=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
var MO=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var LS_KEY='weekly-bars-v1';

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normDigits(s){
  return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
    .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
    .replace(/[٫,،]/g,'.');
}
function num(v){var n=parseFloat(normDigits(v));return isFinite(n)?n:NaN}
var idc=0;function nid(p){return p+Date.now().toString(36)+(idc++).toString(36)}
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pkey(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function dayIdx(d){return (d.getDay()+1)%7}
function weekStart(d){return addDays(d,-dayIdx(d))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function fmtN(x){var r=Math.round(x*10)/10;return String(r)}
function fmtMin(m){
  m=Math.round(m);
  if(m<60)return m+' د';
  var h=Math.floor(m/60),r=m%60;
  return r?h+'س '+r+'د':h+'س';
}
function dayLabel(d){return d.getDate()+' '+MO[d.getMonth()]}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t}

var ICON={
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7-2.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- state ---------- */
function defaultState(){
  return {
    v:1,
    week:{start:dkey(weekStart(new Date())),off:[]},
    locks:{date:'',m:{}},
    logs:[],
    history:[],
    hintOff:false,
    unseen:false,
    goals:[
      {id:'g_hifz',name:'حفظ جديد',target:4,tu:'u_page',cap:null,units:[{id:'u_page',name:'صفحة',min:45}]},
      {id:'g_de',name:'الألماني',target:40,tu:'u_word',cap:null,units:[{id:'u_word',name:'كلمة',min:1.5},{id:'u_lesson',name:'درس',min:30}]},
      {id:'g_gym',name:'الجيم',target:12,tu:'u_set',cap:8,units:[{id:'u_set',name:'مجموعة',min:6}]},
      {id:'g_dent',name:'مذاكرة الأسنان',target:6,tu:'u_hour',cap:null,units:[{id:'u_hour',name:'ساعة',min:60}]}
    ]
  };
}
var state=defaultState();
var loaded=false;
var ui={tab:'today',repTab:'week',openGoals:{},openWeeks:{},confirmDel:null,storage:'local'};
var sheet={open:false,step:1,gid:null,uid:null,q:1,day:'today'};

function normalize(s){
  var d=defaultState();
  if(!s||typeof s!=='object')return d;
  s.v=1;
  if(!s.week||!s.week.start)s.week=d.week;
  if(!Array.isArray(s.week.off))s.week.off=[];
  if(!s.locks||typeof s.locks!=='object')s.locks={date:'',m:{}};
  if(!s.locks.m)s.locks.m={};
  if(!Array.isArray(s.logs))s.logs=[];
  if(!Array.isArray(s.history))s.history=[];
  if(!Array.isArray(s.goals)||!s.goals.length)s.goals=d.goals;
  s.goals.forEach(function(g){
    if(!Array.isArray(g.units)||!g.units.length)g.units=[{id:nid('u_'),name:'وحدة',min:30}];
    if(!g.units.some(function(u){return u.id===g.tu}))g.tu=g.units[0].id;
  });
  return s;
}

/* ---------- storage ---------- */
var docRef=null,saveTimer=null,writing=false,dirty=false;
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function loadLocal(){try{var t=localStorage.getItem(LS_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function save(){
  if(!loaded)return;
  saveLocal();
  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
function flush(){
  if(!docRef||writing||!dirty)return;
  writing=true;dirty=false;
  var snap=JSON.parse(JSON.stringify(state));
  docRef.set({state:snap,updated:Date.now()}).then(function(){writing=false;if(dirty)flush()},function(){writing=false;ui.storage='local';});
}
function init(){
  var local=loadLocal();
  var fromLocal=local?normalize(local):null;
  var useCap=window.claude&&window.claude.use;
  if(!useCap){state=fromLocal||state;finishLoad(!!fromLocal);return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return null;
      docRef=db.doc('data/users/'+id+'/tracker');
      return docRef.get();
    });
  }).then(function(snap){
    if(snap&&snap.exists&&snap.data()&&snap.data().state){
      state=normalize(snap.data().state);ui.storage='account';
    }else{
      if(fromLocal)state=fromLocal;
      if(docRef)ui.storage='account';
    }
    finishLoad(true);
    if(docRef){dirty=true;flush()}
  }).catch(function(){
    docRef=null;if(fromLocal)state=fromLocal;ui.storage='local';finishLoad(true);
  });
}
function finishLoad(){
  loaded=true;
  ensureWeek();
  saveLocal();
  render();
}

/* ---------- week rollover ---------- */
function weekStatsFor(start,logs,goals){
  var keys=[];for(var i=0;i<7;i++)keys.push(dkey(addDays(pkey(start),i)));
  return goals.map(function(g){
    var tu=g.units.filter(function(u){return u.id===g.tu})[0]||g.units[0];
    var by=[0,0,0,0,0,0,0],done=0;
    logs.forEach(function(l){
      if(l.g!==g.id)return;
      done+=l.m;var di=keys.indexOf(l.d);if(di>=0)by[di]+=l.m;
    });
    return {name:g.name,un:tu.name,um:tu.min,t:g.target*tu.min,d:done,by:by};
  });
}
function archive(){
  if(!state.logs.length)return;
  var st=weekStatsFor(state.week.start,state.logs,state.goals);
  state.history.unshift({start:state.week.start,end:dkey(addDays(pkey(state.week.start),6)),off:state.week.off.length,goals:st});
  if(state.history.length>104)state.history.length=104;
}
function ensureWeek(){
  var cur=dkey(weekStart(new Date()));
  if(state.week.start!==cur){
    archive();
    state.week={start:cur,off:[]};
    state.logs=[];
    state.locks={date:'',m:{}};
    state.unseen=state.history.length>0;
    save();
  }
}

/* ---------- model ---------- */
function compute(){
  var now=new Date(),tk=dkey(now),start=pkey(state.week.start);
  var days=[];
  for(var i=0;i<7;i++){var d=addDays(start,i),k=dkey(d);days.push({i:i,key:k,date:d,off:state.week.off.indexOf(k)>=0})}
  var idx=0;days.forEach(function(d){if(d.key===tk)idx=d.i});
  var D=days.filter(function(d){return d.i>=idx&&!d.off}).length;
  var Dd=Math.max(D,1);
  var rows=state.goals.map(function(g){
    var tu=g.units.filter(function(u){return u.id===g.tu})[0]||g.units[0];
    var target=g.target*tu.min,done=0,T=0,by=[0,0,0,0,0,0,0];
    state.logs.forEach(function(l){
      if(l.g!==g.id)return;
      done+=l.m;if(l.d===tk)T+=l.m;
      for(var j=0;j<7;j++)if(days[j].key===l.d)by[j]+=l.m;
    });
    var S=Math.max(0,target-(done-T));
    return {g:g,tu:tu,target:target,done:done,T:T,S:S,by:by,p:0,locked:false};
  });
  var sumS=sum(rows,function(r){return r.S});
  var Q=sumS/Dd;
  var lk=state.locks.date===tk?state.locks.m:{};
  var sumT=sum(rows,function(r){return r.T});
  rows.forEach(function(r){r.rem=Math.max(0,r.target-r.done);r.r=0;r.frozen=false;r.locked=false;r.p=r.T});
  function capLeft(r){return r.g.cap>0?Math.max(0,r.g.cap*r.tu.min-r.T):Infinity}
  var active=[],lockedR=0;
  rows.forEach(function(r){
    if(r.rem<=0.01)return;
    if(lk[r.g.id]!=null&&r.S>0){
      r.locked=true;r.p=clamp(lk[r.g.id],Math.min(r.T,r.S),r.S);r.r=Math.max(0,r.p-r.T);lockedR+=r.r;return;
    }
    var nat=r.S/Dd;
    if(r.g.cap>0)nat=Math.min(nat,r.g.cap*r.tu.min);
    if(r.T>0.01&&r.T>=nat-0.01){r.frozen=true;return}
    active.push(r);
  });
  var room=Math.max(0,Q-sumT);
  var over=Math.max(0,lockedR-room);
  var budget=Math.max(0,room-lockedR);
  var set=active.slice();
  function maxR(r){return Math.min(r.rem,capLeft(r))}
  while(set.length){
    var W=sum(set,function(r){return r.rem});
    var hit=null;
    for(var k=0;k<set.length;k++){if(budget*set[k].rem/W>maxR(set[k])+1e-9){hit=set[k];break}}
    if(hit){hit.r=maxR(hit);budget-=hit.r;set=set.filter(function(r){return r!==hit})}
    else{set.forEach(function(r){r.r=budget*r.rem/W});budget=0;set=[]}
  }
  /* caps are soft: if the active bars can't reach the day's quota, fill the rest up to what each goal still has left */
  var guard=0;
  while(budget>0.01&&guard++<10){
    var rm=active.filter(function(r){return r.rem-r.r>0.01});
    if(!rm.length)break;
    var Rm=sum(rm,function(r){return r.rem-r.r});
    var take=Math.min(budget,Rm);
    rm.forEach(function(r){r.r+=take*(r.rem-r.r)/Rm});
    budget-=take;
  }
  active.forEach(function(r){r.p=r.T+r.r});
  var unalloc=Math.max(0,budget);
  var Wt=sum(rows,function(r){return r.target});
  var doneTot=sum(rows,function(r){return Math.min(r.done,r.target)});
  var startDone=sum(rows,function(r){return r.target-r.S});
  var planSum=sum(rows,function(r){return r.p});
  var Tt=sumT;
  var left=sum(rows,function(r){return r.r});
  return {tk:tk,idx:idx,days:days,D:D,rows:rows,Q:Q,W:Wt,doneTot:doneTot,startDone:startDone,planSum:planSum,
    marker:Wt>0?clamp((startDone+planSum)/Wt,0,1):0,Tt:Tt,left:left,over:over,unalloc:unalloc};
}

function goalCard(r){
  var g=r.g,um=r.tu.min,uname=esc(r.tu.name);
  var remNow=Math.max(0,r.target-r.done);
  if(r.target<=0){
    return '<section class="card goal"><div class="row between"><h3>'+esc(g.name)+'</h3><span class="mute small">من غير هدف</span></div></section>';
  }
  if(r.rem<=0.01){
    return '<section class="card goal"><div class="row between"><h3>'+esc(g.name)+'</h3><span class="done-tag">'+ICON.check+' اتحقق الهدف</span></div>'+
      '<p class="mute small" style="margin:6px 0 0">منجز '+fmtN(r.done/um)+' '+uname+' ('+fmtMin(r.done)+')</p></section>';
  }
  var Su=r.S/um;
  var n=Math.max(1,Math.ceil(Su-1e-9));
  var groups=[1,2,5,10,20,50,100,200],grp=1;
  for(var i=0;i<groups.length;i++){grp=groups[i];if(n/grp<=14)break}
  var ticks='';
  for(var k=grp;k<Su-1e-9;k+=grp){ticks+='<i class="tick" style="right:'+(k/Su*100)+'%"></i>'}
  var planPct=clamp(r.p/r.S,0,1)*100;
  var fillPct=clamp(r.T/r.S,0,1)*100;
  var lockedCls=(r.locked||r.frozen)?' locked':'';
  return '<section class="card goal">'+
    '<div class="row between"><h3>'+esc(g.name)+'</h3>'+
      (r.frozen?'<span class="done-tag">'+ICON.lock+' خلصت حصة النهاردة</span>':'<button class="lockbtn" data-act="lock" data-g="'+g.id+'" aria-pressed="'+r.locked+'">'+(r.locked?ICON.lock+'مثبّت':ICON.unlock+'تلقائي')+'</button>')+'</div>'+
    '<div class="gstats">'+
      '<div><b data-live="p:'+g.id+'">'+fmtN(r.p/um)+' '+uname+'</b><span data-live="pm:'+g.id+'">خطة النهاردة · '+fmtMin(r.p)+'</span></div>'+
      '<div><b>'+fmtN(r.T/um)+' '+uname+'</b><span>منجز النهاردة</span></div>'+
      '<div><b>'+fmtN(remNow/um)+' '+uname+'</b><span>باقي الأسبوع</span></div>'+
    '</div>'+
    '<div class="bar" data-bar="'+g.id+'" role="slider" aria-label="حصة النهاردة من '+esc(g.name)+'" aria-valuemin="0" aria-valuemax="'+fmtN(Su)+'" aria-valuenow="'+fmtN(r.p/um)+'">'+
      '<div class="bar-in"><i class="plan" style="width:'+planPct+'%"></i><i class="fill" style="width:'+fillPct+'%"></i>'+ticks+'</div>'+
      '<b class="handle'+lockedCls+'" style="right:'+planPct+'%"></b>'+
    '</div>'+
    '<div class="barfoot"><span>القسم الواحد = '+grp+' '+uname+'</span><span>الشريط = '+fmtN(Su)+' '+uname+' (من أول النهاردة)</span></div>'+
  '</section>';
}
function renderLogs(m){

/* ---------- render: report ---------- */
function pct(d,t){return t>0?d/t*100:0}
function bestDay(by){
  var bi=-1,bv=0;by.forEach(function(v,i){if(v>bv){bv=v;bi=i}});
  return bi>=0?WD[bi]:null;
}
function goalReportRow(g){
  var p=pct(g.d,g.t);
  var bd=bestDay(g.by);
  return '<div class="rrow"><div class="row between"><b>'+esc(g.name)+'</b><span class="num">'+Math.round(p)+'%</span></div>'+
    '<div class="rbar"><i style="width:'+clamp(p,0,100)+'%"></i></div>'+
    '<span class="mute small">'+fmtN(g.d/g.um)+' من '+fmtN(g.t/g.um)+' '+esc(g.un)+' · '+fmtMin(g.d)+(bd?' · أنشط يوم: '+bd:'')+'</span></div>';
}
function weekSummary(goals){
  var t=sum(goals,function(g){return g.t}),d=sum(goals,function(g){return Math.min(g.d,g.t)});
  var perDay=[0,0,0,0,0,0,0];goals.forEach(function(g){g.by.forEach(function(v,i){perDay[i]+=v})});
  var active=perDay.filter(function(v){return v>0}).length;
  var full=goals.filter(function(g){return g.t>0&&g.d>=g.t-0.01}).length;
  return {t:t,d:d,p:pct(d,t),active:active,full:full,count:goals.filter(function(g){return g.t>0}).length,best:bestDay(perDay)};
}
function renderReport(m){
  var seg='<div class="seg"><button data-act="rep-tab" data-v="week" aria-pressed="'+(ui.repTab==='week')+'">هذا الأسبوع</button><button data-act="rep-tab" data-v="history" aria-pressed="'+(ui.repTab==='history')+'">السجل</button></div>';
  var out='<header class="top"><h1>التقرير</h1></header><div class="stack">'+seg;
  if(ui.repTab==='week'){
    var st=weekStatsFor(state.week.start,state.logs,state.goals);
    var s=weekSummary(st);
    out+='<section class="card"><div class="row between"><h2>ملخص الأسبوع</h2><span class="num" style="font-size:26px">'+Math.round(s.p)+'%</span></div>'+
      '<div class="rbar" style="margin:10px 0"><i style="width:'+clamp(s.p,0,100)+'%"></i></div>'+
      '<p class="mute small" style="margin:0">'+fmtMin(s.d)+' من '+fmtMin(s.t)+' · اتحقق '+s.full+' من '+s.count+' أهداف · اشتغلت '+s.active+' '+(s.active===1?'يوم':'أيام')+(s.best?' · أنشط يوم: '+s.best:'')+'</p></section>';
    out+='<section class="card"><h2>كل هدف</h2>'+st.map(goalReportRow).join('')+'</section>';
  }else{
    if(!state.history.length){
      out+='<section class="card"><p class="mute" style="margin:0">السجل فاضي. أول أسبوع بيتحفظ هنا أول ما يخلص (الأسبوع بيبدأ السبت).</p></section>';
    }else{
      var names={};
      state.history.forEach(function(h){h.goals.forEach(function(g){(names[g.name]=names[g.name]||[]).push(pct(g.d,g.t))})});
      var avg=Object.keys(names).map(function(n){var a=names[n];return '<div class="row between" style="padding:5px 0"><span>'+esc(n)+'</span><span class="num">'+Math.round(sum(a,function(x){return x})/a.length)+'%</span></div>'}).join('');
      out+='<section class="card"><h2>المتوسط على '+state.history.length+' '+(state.history.length===1?'أسبوع':'أسابيع')+'</h2><div style="margin-top:6px">'+avg+'</div></section>';
      state.history.forEach(function(h){
        var s=weekSummary(h.goals),open=!!ui.openWeeks[h.start];
        out+='<section class="card"><button class="row between" style="width:100%;text-align:start" data-act="toggle-week" data-start="'+h.start+'" aria-expanded="'+open+'">'+
          '<span><b>'+dayLabel(pkey(h.start))+' – '+dayLabel(pkey(h.end))+'</b><br><span class="mute small">اتحقق '+s.full+' من '+s.count+(h.off?' · '+h.off+' إجازة':'')+'</span></span><span class="num" style="font-size:22px">'+Math.round(s.p)+'%</span></button>'+
          '<div class="rbar" style="margin-top:8px"><i style="width:'+clamp(s.p,0,100)+'%"></i></div>'+
          (open?'<div style="margin-top:6px">'+h.goals.map(goalReportRow).join('')+'</div>':'')+'</section>';
      });
    }
  }
  return out+'</div>';
}

      '<div class="chips" style="margin-bottom:14px">'+pre+'</div>'+
      '<div class="stepper" style="margin-bottom:6px;justify-content:center"><button data-act="step" data-d="-1" aria-label="أقل">−</button><input id="qin" type="text" inputmode="decimal" value="'+fmtN(sheet.q)+'" aria-label="الكمية"><button data-act="step" data-d="1" aria-label="أكتر">+</button></div>'+
      '<p class="mute" style="text-align:center;margin:0 0 14px" id="qmin">'+fmtN(sheet.q)+' '+esc(u.name)+' = '+fmtMin(tot)+'</p>'+
      '<div class="chips" style="margin-bottom:16px;justify-content:center"><button class="chip" data-act="set-day" data-v="today" aria-pressed="'+(sheet.day==='today')+'">النهاردة</button><button class="chip" data-act="set-day" data-v="yesterday" aria-pressed="'+(sheet.day==='yesterday')+'"'+(yOk?'':' disabled style="opacity:.4"')+'>إمبارح</button></div>'+
      '<button class="primary" data-act="confirm-log">سجّل</button>';
  }
  el.innerHTML=h;
}
function updateQ(){
  var g=goalById(sheet.gid),u=unitById(g,sheet.uid);
  var mm=document.getElementById('qmin');
  if(mm)mm.textContent=fmtN(sheet.q)+' '+u.name+' = '+fmtMin(sheet.q*u.min);
}
function confirmLog(){
  var g=goalById(sheet.gid),u=unitById(g,sheet.uid);
  if(!g||!u||!(sheet.q>0))return;
  var now=new Date(),key=dkey(now);
  if(sheet.day==='yesterday')key=dkey(addDays(now,-1));
  var entry={id:nid('l_'),t:Date.now(),d:key,g:g.id,u:u.id,un:u.name,q:sheet.q,m:sheet.q*u.min};
  state.logs.push(entry);
  save();
  closeSheet();
  render();
  toast('اتسجل: '+fmtN(entry.q)+' '+u.name+' ('+fmtMin(entry.m)+')',function(){
    state.logs=state.logs.filter(function(l){return l.id!==entry.id});save();render();
  });
}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg,undo){
  var t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">تراجع</button>':'');
  t.hidden=false;
  t._undo=undo||null;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;t._undo=null},6000);
}

/* ---------- drag on goal bars ---------- */
var drag=null,raf=0;
function setLive(k,t){var e=document.querySelector('[data-live="'+k+'"]');if(e&&e.textContent!==t)e.textContent=t}
function liveUpdate(){
  var m=compute();
  m.rows.forEach(function(r){
    if(r.rem<=0.01||r.S<=0)return;
    var bar=document.querySelector('[data-bar="'+r.g.id+'"]');
    if(!bar)return;
    var pp=clamp(r.p/r.S,0,1)*100,um=r.tu.min;
    bar.querySelector('.plan').style.width=pp+'%';
    bar.querySelector('.handle').style.right=pp+'%';
    bar.setAttribute('aria-valuenow',fmtN(r.p/um));
    setLive('p:'+r.g.id,fmtN(r.p/um)+' '+r.tu.name);
    setLive('pm:'+r.g.id,'خطة النهاردة · '+fmtMin(r.p));
  });
  setLive('left',fmtMin(m.left));
}
/* smooth: continuous while dragging, snapped to the unit step on release */
function setLockFromX(e,snap){
  var m=compute(),r=m.rows.filter(function(x){return x.g.id===drag.gid})[0];
  if(!r||r.S<=0||r.rem<=0.01)return;
  var um=r.tu.min,Su=r.S/um;
  var x=clamp((drag.rect.right-e.clientX)/drag.rect.width,0,1);
  var u=x*Su;
  if(snap){var st=stepFor(um);u=Math.round(u/st)*st}
  u=clamp(u,Math.min(r.T,r.S)/um,Su);
  state.locks.date=m.tk;
  state.locks.m[drag.gid]=u*um;
}
function endDrag(){
  if(!drag)return;
  var bar=document.querySelector('[data-bar="'+drag.gid+'"]');
  if(bar)bar.classList.remove('active');
  drag=null;save();render();
}
document.addEventListener('pointerdown',function(e){
  var bar=e.target.closest&&e.target.closest('[data-bar]');
  if(!bar||ui.tab!=='today')return;
  drag={gid:bar.getAttribute('data-bar'),rect:bar.getBoundingClientRect(),x:e.clientX,moved:false,pid:e.pointerId};
  bar.classList.add('active');
  try{bar.setPointerCapture(e.pointerId)}catch(err){}
  setLockFromX(e,false);liveUpdate();
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  drag.moved=true;
  var ev={clientX:e.clientX};
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(function(){raf=0;if(!drag)return;setLockFromX(ev,false);liveUpdate()});
});
window.addEventListener('pointerup',function(e){
  if(!drag)return;
  if(raf){cancelAnimationFrame(raf);raf=0}
  setLockFromX(e,true);
  endDrag();
});
window.addEventListener('pointercancel',function(){
  if(!drag)return;
  if(raf){cancelAnimationFrame(raf);raf=0}
  endDrag();
});

/* ---------- actions ---------- */
function toggleLock(gid){
  var m=compute(),r=m.rows.filter(function(x){return x.g.id===gid})[0];
  if(!r)return;
  if(state.locks.date!==m.tk)state.locks={date:m.tk,m:{}};
  if(state.locks.m[gid]!=null)delete state.locks.m[gid];
  else state.locks.m[gid]=r.p;
}
function newGoal(){
  var uid=nid('u_');
  var g={id:nid('g_'),name:'هدف جديد',target:1,tu:uid,cap:null,units:[{id:uid,name:'وحدة',min:30}]};
  state.goals.push(g);ui.openGoals[g.id]=true;
}
var actions={
  'tab':function(el){ui.tab=el.getAttribute('data-v');window.scrollTo(0,0)},
  'open-log':function(){openSheet();return 'nopaint'},
  'close-sheet':function(){closeSheet();return 'nopaint'},
  'back-sheet':function(){sheet.step=1;renderSheet();return 'nopaint'},
  'pick-goal':function(el){
    var g=goalById(el.getAttribute('data-g'));
    sheet.gid=g.id;sheet.uid=g.tu;sheet.step=2;
    var u=unitById(g,g.tu);sheet.q=u.min>=5?1:10;
    renderSheet();return 'nopaint';
  },
  'pick-unit':function(el){
    var g=goalById(sheet.gid);sheet.uid=el.getAttribute('data-u');
    var u=unitById(g,sheet.uid);sheet.q=u.min>=5?1:10;
    renderSheet();return 'nopaint';
  },
  'set-q':function(el){sheet.q=parseFloat(el.getAttribute('data-v'));renderSheet();return 'nopaint'},
  'set-day':function(el){sheet.day=el.getAttribute('data-v');renderSheet();return 'nopaint'},
  'step':function(el){
    var g=goalById(sheet.gid),u=unitById(g,sheet.uid);
    var d=parseFloat(el.getAttribute('data-d'))*stepFor(u.min);
    sheet.q=Math.max(stepFor(u.min),Math.round((sheet.q+d)*100)/100);
    renderSheet();return 'nopaint';
  },
  'confirm-log':function(){confirmLog();return 'nopaint'},
  'undo':function(){var t=document.getElementById('toast');if(t._undo)t._undo();t.hidden=true;t._undo=null;return 'nopaint'},
  'lock':function(el){toggleLock(el.getAttribute('data-g'));save()},
  'unlock-all':function(){state.locks={date:'',m:{}};save()},
  'toggle-off':function(el){
    var k=el.getAttribute('data-day'),i=state.week.off.indexOf(k);
    if(i>=0)state.week.off.splice(i,1);else state.week.off.push(k);
    save();
  },
  'del-log':function(el){
    var id=el.getAttribute('data-id'),old=state.logs.filter(function(l){return l.id===id})[0];
    state.logs=state.logs.filter(function(l){return l.id!==id});save();
    if(old)toast('اتحذف التسجيل',function(){state.logs.push(old);save();render()});
  },
  'hint-off':function(){state.hintOff=true;save()},
  'see-report':function(){state.unseen=false;ui.tab='report';ui.repTab='history';ui.openWeeks[state.history[0].start]=true;save()},
  'rep-tab':function(el){ui.repTab=el.getAttribute('data-v');if(ui.repTab==='history'&&state.unseen){state.unseen=false;save()}},
  'toggle-week':function(el){var s=el.getAttribute('data-start');ui.openWeeks[s]=!ui.openWeeks[s]},
  'add-goal':function(){newGoal();save()},
  'add-unit':function(el){
    var g=goalById(el.getAttribute('data-g'));
    g.units.push({id:nid('u_'),name:'وحدة جديدة',min:10});ui.openGoals[g.id]=true;save();
  },
  'del-unit':function(el){
    var g=goalById(el.getAttribute('data-g')),uid=el.getAttribute('data-u');
    if(g.units.length<2||uid===g.tu)return;
    g.units=g.units.filter(function(u){return u.id!==uid});save();
  },
  'del-goal':function(el){ui.confirmDel=el.getAttribute('data-g');ui.openGoals[ui.confirmDel]=true},
  'del-goal-no':function(){ui.confirmDel=null},
  'del-goal-yes':function(el){
    var id=el.getAttribute('data-g');
    state.goals=state.goals.filter(function(g){return g.id!==id});
    delete state.locks.m[id];ui.confirmDel=null;
    if(!state.goals.length)newGoal();
    save();
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var fn=actions[el.getAttribute('data-act')];
  if(!fn)return;
  var r=fn(el);
  if(r!=='nopaint')render();
});
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeSheet()});

document.addEventListener('input',function(e){
  if(e.target.id==='qin'){
    var v=num(e.target.value);
    if(isFinite(v)&&v>0){sheet.q=v;updateQ()}
  }
});
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(d&&d.classList&&d.classList.contains('gset')){ui.openGoals[d.getAttribute('data-g')]=d.open}
},true);
document.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-k');
  if(!k)return;
  var g=goalById(el.getAttribute('data-g'));
  if(!g)return;
  var v=el.value,n=num(v);
  if(k==='g-name'){g.name=v.trim()||g.name}
  else if(k==='g-target'){if(isFinite(n)&&n>=0)g.target=n}
  else if(k==='g-tu'){g.tu=v}
  else if(k==='g-cap'){g.cap=(isFinite(n)&&n>0)?n:null}
  else if(k==='u-name'){var u=unitById(g,el.getAttribute('data-u'));if(u)u.name=v.trim()||u.name}
  else if(k==='u-min'){var u2=unitById(g,el.getAttribute('data-u'));if(u2&&isFinite(n)&&n>0)u2.min=n}
  save();render();
});

/* day change / return to app */
var lastKey=dkey(new Date());
function tick(){
  var k=dkey(new Date());
  if(k!==lastKey&&loaded){lastKey=k;ensureWeek();render()}
}
setInterval(tick,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

render();
init();
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#f2f2f7">
<title>Planner</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--mute:#8e8e93;--line:#e5e5ea;--acc:#5856d6;--green:#34c759;--red:#ff3b30;--fill:#e9e9ee}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--mute:#8e8e93;--line:#2c2c2e;--acc:#7d7aff;--fill:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--text);border:0;outline:0;background:var(--fill);border-radius:10px;padding:9px 12px;width:100%;min-width:0;-webkit-appearance:none}
.page{display:none;padding:12px 14px calc(92px + env(safe-area-inset-bottom))}
.page.on{display:block}
h1{font-size:30px;margin:6px 2px 14px;letter-spacing:-.5px}
.card{background:var(--card);border-radius:16px;padding:6px 14px 10px;margin-bottom:14px}
.sub{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding:8px 0 4px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--mute)}
.tab.on{color:var(--acc);font-weight:600}
.tab svg{width:26px;height:26px}

/* execution */
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow label{width:86px;flex:none;font-weight:600;font-size:15px}
.step{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.step textarea{resize:none;overflow:hidden;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:5px 2px;height:32px}
.step.done textarea{text-decoration:line-through;color:var(--mute)}
.ck{flex:none;width:28px;height:28px;margin-top:2px;border-radius:50%;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.ck.on{background:var(--acc);border-color:var(--acc)}
.newstep{color:var(--acc);font-weight:600;padding:8px 0 2px}
.danger{width:100%;padding:15px;border-radius:14px;background:var(--red);color:#fff;font-weight:600;font-size:17px}

/* modal */
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px}
.sheet p{margin:0 0 16px;text-align:center;font-size:16px}
.srow{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--fill);font-weight:600}
.btn.dng{background:var(--red);color:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:120;max-width:85%;text-align:center}

/* vision */
.vbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:6px 0 10px;background:var(--bg)}
.vb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border-radius:12px;padding:10px 0;font-weight:600;font-size:15px;color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:40px 20px}
.blk{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden}
.bh{display:flex;justify-content:flex-end;gap:2px;padding:4px 6px 0}
.mb{width:34px;height:30px;color:var(--mute);font-size:14px}
.blk img{display:block;width:100%;height:auto}
.rt{min-height:90px;padding:8px 14px 16px;outline:0;-webkit-user-select:text;user-select:text;word-break:break-word}
.rt ul,.rt ol{margin:4px 0;padding-inline-start:24px}
.fbar[hidden]{display:none}
.mb.on{color:var(--acc)}
.fbar{display:flex;gap:5px;overflow-x:auto;padding:6px 10px;border-bottom:1px solid var(--line);align-items:center;-webkit-overflow-scrolling:touch}
.fb{flex:none;min-width:34px;height:32px;padding:0 8px;border-radius:8px;background:var(--fill);font-size:15px}
.cdot{flex:none;width:24px;height:24px;border-radius:50%}
.tw{overflow-x:auto;padding:8px 10px 12px;-webkit-overflow-scrolling:touch}
.tw table{border-collapse:collapse;width:100%}
.tw td{border:1px solid var(--line);padding:8px;min-width:96px;height:40px;vertical-align:top;outline:0;-webkit-user-select:text;user-select:text}
.tw td:focus{background:var(--fill)}
.tw tr.ttl td{font-weight:700;text-align:center;font-size:17px;background:var(--fill)}
.tw td.tt:empty::before{content:"Table title";color:var(--mute);font-weight:400}

/* home */
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ar{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:28px;line-height:1;color:var(--acc);flex:none;padding-bottom:3px}
.wl{text-align:center;flex:1}
.wt{font-weight:700;font-size:17px}
.wsub{font-size:13px;color:var(--green);font-weight:600}
.pill{margin-top:3px;font-size:13px;color:#fff;background:var(--acc);padding:3px 12px;border-radius:12px;font-weight:600}
@keyframes inR{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
.inR{animation:inR .25s ease}.inL{animation:inL .25s ease}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dc{background:var(--card);border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;min-width:0}
.dc.today{border-color:var(--acc)}
.dn{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.dd{font-size:17px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.r{background:var(--red)}
.dot.g{background:var(--green)}
.ov.mid{align-items:center}
.dsheet{max-height:75vh;overflow-y:auto}
.dtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
.empty.small{padding:14px}
.t{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.t .ck{width:24px;height:24px;margin:0;font-size:13px}
.tt{flex:1;word-break:break-word}
.t.x .tt{text-decoration:line-through;color:var(--mute)}
.rm{color:var(--mute);width:30px;height:30px;font-size:15px}
.addr{display:flex;gap:6px;margin-top:8px}
.addr input{padding:7px 10px}
.addr button{flex:none;width:38px;border-radius:10px;background:var(--acc);color:#fff;font-size:22px;line-height:1}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.fv{aspect-ratio:1;border-radius:18px;background:var(--fill);font-size:12px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;word-break:break-word;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
.fv.g{background:var(--green);color:#fff}
.fv.r{background:var(--red);color:#fff}
.goals h3{margin:14px 0 8px 2px;font-size:18px}
.nd{margin-bottom:6px}
.nr{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;border-left:5px solid var(--c);padding:8px 10px 8px 4px;min-height:46px}
.nr .ck{width:26px;height:26px;margin:0;border-color:var(--c);font-size:14px}
.nr .ck.on{background:var(--c);border-color:var(--c)}
.tri{flex:none;width:30px;height:30px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.tri svg{width:14px;height:14px;transition:transform .15s}
.tri.open{color:var(--text)}
.tri.open svg{transform:rotate(90deg)}
.nt{flex:1;min-width:0;word-break:break-word;font-size:16px}
.nt.done{color:var(--mute);text-decoration:line-through}
.cnt{font-size:12px;color:var(--mute);flex:none}
.kids{margin-left:22px;margin-top:6px}
.pal.p{background:var(--card);border-radius:12px;padding:10px;margin-top:4px}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pal .cdot{width:24px;height:24px}
.pal .cdot.sel{outline:2px solid var(--text);outline-offset:2px}
.pal .rm{margin-left:auto;width:auto;padding:0 6px;font-size:13px;color:var(--red)}
.copy{margin:14px 0 0;width:100%;padding:12px;border-radius:12px;background:var(--card);color:var(--acc);font-weight:600;font-size:15px}
.col .addr input{font-size:16px}
</style>
</head>
<body>

<div class="page" id="pg-vision"></div>
<div class="page" id="pg-home"></div>
<div class="page" id="pg-execution"></div>

<nav id="tabs">
  <button class="tab" data-t="vision">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Vision</button>
  <button class="tab" data-t="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</button>
  <button class="tab" data-t="execution">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M13 7h7M13 15h7"/></svg>Execution</button>
</nav>

<script>
(function(){
const KEY='vhe-planner-v1';
const PAL=['#34c759','#007aff','#ff9500','#af52de','#ff2d55','#5ac8fa'];
const DAYS=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({tab:'home',exec:null,vision:[],days:{},weeks:{},labels:['1','2','3','4','5']},S||{});
const freshExec=()=>({f:{goal:'',task:'',motive:'',dep:''},steps:[{t:'',d:false}]});
if(!S.exec)S.exec=freshExec();

const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full – delete some images')}}
function toast(m){const t=h('div',{id:'toast'},m);document.body.append(t);setTimeout(()=>t.remove(),2600)}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}
function svg(d){const s=document.createElement('span');s.style.display='inline-flex';s.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';return s}
function modal(msg,okLabel,onOk){
  const o=h('div',{class:'ov'},h('div',{class:'sheet'},h('p',{},msg),
    h('div',{class:'srow'},
      h('button',{class:'btn',onclick:()=>o.remove()},'Cancel'),
      h('button',{class:'btn dng',onclick:()=>{o.remove();onOk()}},okLabel))));
  document.body.append(o);
}
function pastePlain(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
}

/* ---------- tabs ---------- */
function show(t){
  S.tab=t;save();
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='pg-'+t));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));

/* ---------- EXECUTION ---------- */
function renderExec(){
  const pg=$('#pg-execution');pg.innerHTML='';
  pg.append(h('h1',{},'Execution'));
  const c=h('div',{class:'card'});
  [['goal','Goal'],['task','Task'],['motive','Motive'],['dep','Dependency']].forEach(([k,l])=>{
    const i=h('input',{type:'text',autocomplete:'off',enterkeyhint:'next'});
    i.value=S.exec.f[k]||'';
    i.addEventListener('input',()=>{S.exec.f[k]=i.value;save()});
    c.append(h('div',{class:'frow'},h('label',{},l),i));
  });
  pg.append(c);
  const sc=h('div',{class:'card'},h('div',{class:'sub'},'Steps'),h('div',{id:'steps'}),
    h('button',{class:'newstep',onclick:()=>{S.exec.steps.push({t:'',d:false});save();renderSteps(S.exec.steps.length-1)}},'+ New step'));
  pg.append(sc);
  pg.append(h('button',{class:'danger',onclick:()=>modal('Clear everything you entered on this page?','Clear',()=>{S.exec=freshExec();save();renderExec()})},'Confirm & Reset'));
  renderSteps();
}
function grow(t){t.style.height='auto';t.style.height=Math.max(32,t.scrollHeight)+'px'}
function renderSteps(focus){
  const list=$('#steps');list.innerHTML='';
  const steps=S.exec.steps;
  steps.forEach((s,i)=>{
    const ck=h('button',{class:'ck'+(s.d?' on':''),'aria-label':'Step done'},s.d?'✓':'');
    ck.addEventListener('click',()=>{
      s.d=!s.d;
      if(s.d&&i===steps.length-1){steps.push({t:'',d:false});save();renderSteps(i+1);return}
      save();renderSteps();
    });
    const ta=h('textarea',{rows:'1',placeholder:'Step '+(i+1),enterkeyhint:'next'});
    ta.value=s.t;
    ta.addEventListener('input',()=>{s.t=ta.value;save();grow(ta)});
    ta.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();steps.splice(i+1,0,{t:'',d:false});save();renderSteps(i+1)}
      else if(e.key==='Backspace'&&ta.value===''&&steps.length>1){e.preventDefault();steps.splice(i,1);save();renderSteps(Math.max(0,i-1))}
    });
    list.append(h('div',{class:'step'+(s.d?' done':'')},ck,ta));
  });
  const tas=list.querySelectorAll('textarea');
  tas.forEach(grow);
  if(focus!=null&&tas[focus])tas[focus].focus();
}

/* ---------- VISION ---------- */
function renderVision(){
  const pg=$('#pg-vision');pg.innerHTML='';
  pg.append(h('h1',{},'Vision'));
  const file=h('input',{type:'file',accept:'image/*',style:'display:none'});
  file.addEventListener('change',()=>{if(file.files[0])addImage(file.files[0]);file.value=''});
  pg.append(h('div',{class:'vbar'},
    h('button',{class:'vb',onclick:()=>file.click()},svg('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>'),'Image'),
    h('button',{class:'vb',onclick:addTable},svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>'),'Table'),
    h('button',{class:'vb',onclick:addText},svg('<path d="M5 7V5h14v2M12 5v14M9 19h6"/>'),'Text')
  ),file,h('div',{id:'vblocks'}));
  renderBlocks();
}
const editing=new WeakSet();
function renderBlocks(){
  const box=$('#vblocks');box.innerHTML='';
  if(!S.vision.length){box.append(h('div',{class:'empty'},'Add an image, a table or some text using the buttons above.'));return}
  S.vision.forEach((b,i)=>{
    const mk=(t,f)=>h('button',{class:'mb',onclick:f},t);
    const editable=b.type==='text'||b.type==='table';
    const eb=editable?h('button',{class:'mb'+(editing.has(b)?' on':''),'aria-label':'Edit options'},svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>')):null;
    const blk=h('div',{class:'blk'},h('div',{class:'bh'},
      eb,
      mk('▲',()=>{if(i>0){[S.vision[i-1],S.vision[i]]=[S.vision[i],S.vision[i-1]];save();renderBlocks()}}),
      mk('▼',()=>{if(i<S.vision.length-1){[S.vision[i+1],S.vision[i]]=[S.vision[i],S.vision[i+1]];save();renderBlocks()}}),
      mk('✕',()=>modal('Delete this '+b.type+'?','Delete',()=>{S.vision.splice(i,1);save();renderBlocks()}))));
    if(editable){
      const inner=b.type==='text'?textBlock(b):tableBlock(b);
      const bar=inner.querySelector('.fbar');
      bar.hidden=!editing.has(b);
      eb.addEventListener('click',()=>{
        if(editing.has(b))editing.delete(b);else editing.add(b);
        bar.hidden=!editing.has(b);eb.classList.toggle('on',editing.has(b));
      });
      blk.append(inner);
    }else blk.append(h('img',{src:b.src,alt:''}));
    box.append(blk);
  });
}
function textBlock(b){
  const rt=h('div',{class:'rt',contenteditable:'true',dir:'auto',html:b.html||''});
  const sync=()=>{b.html=rt.innerHTML;save()};
  rt.addEventListener('input',sync);
  rt.addEventListener('paste',pastePlain);
  const run=(c,v)=>()=>{rt.focus();document.execCommand(c,false,v);sync()};
  const size=d=>()=>{rt.focus();let c=parseInt(document.queryCommandValue('fontSize'))||3;c=Math.max(1,Math.min(7,c+d));document.execCommand('fontSize',false,String(c));sync()};
  const fb=(label,fn,style)=>h('button',{class:'fb',style:style||'',onclick:fn},label);
  const bar=h('div',{class:'fbar'},
    fb('B',run('bold'),'font-weight:800'),
    fb('I',run('italic'),'font-style:italic'),
    fb('U',run('underline'),'text-decoration:underline'),
    fb('S',run('strikeThrough'),'text-decoration:line-through'),
    fb('A−',size(-1)),fb('A+',size(1)),
    fb('•',run('insertUnorderedList')),fb('1.',run('insertOrderedList')),
    fb('⇤',run('justifyLeft')),fb('≡',run('justifyCenter')),fb('⇥',run('justifyRight')),
    ...['#ff3b30','#ff9500','#34c759','#007aff','#af52de'].map(c=>h('button',{class:'cdot',style:'background:'+c,'aria-label':'Text colour',onclick:run('foreColor',c)})),
    fb('Clear',run('removeFormat'),'font-size:13px'));
  bar.addEventListener('mousedown',e=>e.preventDefault());
  return h('div',{},bar,rt);
}
function newCell(){const d=document.createElement('td');d.contentEditable='true';d.setAttribute('dir','auto');return d}
function tableBlock(b){
  const tw=h('div',{class:'tw',html:b.html});
  const tbl=()=>tw.querySelector('table');
  let cur=null;
  tw.addEventListener('focusin',e=>{const td=e.target.closest&&e.target.closest('td');if(td)cur=td});
  tw.addEventListener('input',()=>{b.html=tbl().outerHTML;save()});
  tw.addEventListener('paste',pastePlain);
  const isT=row=>row.classList.contains('ttl');
  const ncols=t=>{let m=0;for(const row of t.rows){let n=0;for(const c of row.cells)n+=c.colSpan||1;m=Math.max(m,n)}return m};
  const op=k=>()=>{
    const t=tbl(),rows=t.rows;
    const ok=cur&&cur.parentElement&&t.contains(cur);
    const r=ok?cur.parentElement.rowIndex:rows.length-1;
    const inT=ok&&isT(rows[r]);
    const n=ncols(t);
    const c=(ok&&!inT)?cur.cellIndex:n-1;
    if(k==='ar'){const nr=t.insertRow(r+1);for(let j=0;j<n;j++)nr.append(newCell())}
    else if(k==='ac'){for(const row of rows){if(isT(row))row.cells[0].colSpan=n+1;else row.insertBefore(newCell(),row.cells[c+1]||null)}}
    else if(k==='dr'){if(!inT&&rows.length>1){t.deleteRow(r);cur=null}}
    else if(k==='dc'){if(n>1){for(const row of Array.from(rows)){if(isT(row))row.cells[0].colSpan=n-1;else row.deleteCell(c)}cur=null}}
    b.html=t.outerHTML;save();
  };
  const fb=(l,k)=>h('button',{class:'fb',onclick:op(k)},l);
  const bar=h('div',{class:'fbar'},fb('+ Row','ar'),fb('+ Column','ac'),fb('− Row','dr'),fb('− Column','dc'));
  bar.addEventListener('mousedown',e=>e.preventDefault());
  return h('div',{},bar,tw);
}
function addText(){S.vision.push({type:'text',html:''});save();renderBlocks();const r=document.querySelectorAll('.rt');if(r.length)r[r.length-1].focus();window.scrollTo(0,document.body.scrollHeight)}
function addTable(){
  const row='<tr>'+'<td contenteditable="true" dir="auto"></td>'.repeat(3)+'</tr>';
  const title='<tr class="ttl"><td class="tt" colspan="3" contenteditable="true" dir="auto"></td></tr>';
  S.vision.push({type:'table',html:'<table><tbody>'+title+row.repeat(3)+'</tbody></table>'});
  save();renderBlocks();window.scrollTo(0,document.body.scrollHeight);
}
function addImage(f){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1000/Math.max(im.width,im.height));
      const w=Math.round(im.width*k),hh=Math.round(im.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=hh;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0,w,hh);
      S.vision.push({type:'image',src:c.toDataURL('image/jpeg',.78)});
      save();renderBlocks();window.scrollTo(0,document.body.scrollHeight);
    };
    im.onerror=()=>toast('Could not read that image');
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

/* ---------- HOME ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
function wkStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x} // Saturday start
const FULL=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
const TRI='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
let view=wkStart(new Date());
let openItem=null,focusFor=null;
function wk(k){return S.weeks[k]||(S.weeks[k]={b:[0,0,0,0,0],g:[]})}

function go(n){view=addD(view,7*n);openItem=null;renderHome(n);window.scrollTo(0,0)}
function goCur(){const c=wkStart(new Date());const dir=c>view?1:-1;view=c;openItem=null;renderHome(dir);window.scrollTo(0,0)}
function dayState(dk){const l=S.days[dk]||[];if(!l.length)return '';return l.every(t=>t.x)?'g':'r'}
function updDots(){document.querySelectorAll('.dc').forEach(c=>{c.querySelector('.dot').className='dot '+dayState(c.dataset.k)})}

function renderHome(dir){
  const pg=$('#pg-home');pg.innerHTML='';
  pg.append(h('h1',{},'Home'));
  const k=key(view),isCur=k===key(wkStart(new Date()));
  const end=addD(view,6);
  const range=MON[view.getMonth()]+' '+view.getDate()+' – '+MON[end.getMonth()]+' '+end.getDate()+', '+end.getFullYear();
  pg.append(h('div',{class:'wk'},
    h('button',{class:'ar','aria-label':'Previous week',onclick:()=>go(-1)},'‹'),
    h('div',{class:'wl'},h('div',{class:'wt'},range),
      isCur?h('div',{class:'wsub'},'This week'):h('button',{class:'pill',onclick:goCur},'Go to current week')),
    h('button',{class:'ar','aria-label':'Next week',onclick:()=>go(1)},'›')));

  const body=h('div',{class:dir?(dir>0?'inR':'inL'):''});pg.append(body);

  // seven days in one row
  const today=key(new Date()),strip=h('div',{class:'strip'});
  for(let i=0;i<7;i++){
    const d=addD(view,i),dk=key(d);
    const c=h('button',{class:'dc'+(dk===today?' today':''),'data-k':dk},
      h('div',{class:'dn'},DAYS[i],h('span',{class:'dot '+dayState(dk)})),
      h('div',{class:'dd'},d.getDate()));
    c.addEventListener('click',()=>openDay(d,i));
    strip.append(c);
  }
  body.append(strip);

  // five tri-state buttons
  const five=h('div',{class:'five'});
  for(let j=0;j<5;j++){
    const st=()=>(S.weeks[k]&&S.weeks[k].b[j])||0;
    const b=h('button',{class:'fv'+(st()===1?' g':st()===2?' r':'')},S.labels[j]||String(j+1));
    let timer=null,long=false;
    const clear=()=>{clearTimeout(timer)};
    b.addEventListener('pointerdown',()=>{
      long=false;clear();
      timer=setTimeout(()=>{long=true;const v=prompt('Name this button',S.labels[j]||'');if(v!==null){S.labels[j]=v.trim().slice(0,14);save();b.textContent=S.labels[j]||String(j+1)}},650);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,clear));
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('click',()=>{
      if(long){long=false;return}
      const w=wk(k);w.b[j]=(w.b[j]+1)%3;save();
      b.className='fv'+(w.b[j]===1?' g':w.b[j]===2?' r':'');
    });
    five.append(b);
  }
  body.append(five);

  body.append(goalsSection(k));

  // copy from previous week
  const cw=S.weeks[k],pw=S.weeks[key(addD(view,-7))];
  if(pw&&pw.g&&pw.g.length&&!(cw&&cw.g.length)){
    const cl=x=>({id:uid(),t:x.t,on:false,c:x.c,open:false,kids:(x.kids||[]).map(cl)});
    body.append(h('button',{class:'copy',onclick:()=>{wk(k).g=pw.g.map(cl);save();renderHome()}},'Copy Goals from last week'));
  }
}

/* day alert window */
function openDay(d,i){
  const dk=key(d);
  const o=h('div',{class:'ov mid'});
  const sheet=h('div',{class:'sheet dsheet'});
  o.append(sheet);
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  function draw(focusAdd){
    sheet.innerHTML='';
    sheet.append(h('div',{class:'dtitle'},h('b',{},FULL[i]+', '+MON[d.getMonth()]+' '+d.getDate()),h('button',{class:'rm','aria-label':'Close',onclick:()=>o.remove()},'✕')));
    const list=S.days[dk]||[];
    if(!list.length)sheet.append(h('div',{class:'empty small'},'No tasks yet'));
    list.forEach(t=>{
      const ck=h('button',{class:'ck'+(t.x?' on':''),'aria-label':'Done'},t.x?'✓':'');
      ck.addEventListener('click',()=>{t.x=!t.x;save();draw()});
      const tt=h('div',{class:'tt'},t.t);
      tt.addEventListener('click',()=>{t.x=!t.x;save();draw()});
      const rm=h('button',{class:'rm','aria-label':'Delete task'},'✕');
      rm.addEventListener('click',()=>{S.days[dk]=S.days[dk].filter(x=>x!==t);if(!S.days[dk].length)delete S.days[dk];save();draw()});
      sheet.append(h('div',{class:'t'+(t.x?' x':'')},ck,tt,rm));
    });
    const inp=h('input',{type:'text',placeholder:'Add task',enterkeyhint:'done',autocomplete:'off'});
    const add=()=>{const v=inp.value.trim();if(!v)return;(S.days[dk]=S.days[dk]||[]).push({id:uid(),t:v,x:false});save();draw(true)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    sheet.append(h('div',{class:'addr'},inp,h('button',{'aria-label':'Add',onclick:add},'+')));
    if(focusAdd)inp.focus();
    updDots();
  }
  draw();
  document.body.append(o);
}

/* goals: collapsible to-do tree */
function goalsSection(k){
  const el=h('div',{class:'col goals'});
  function addRow(ph,fid,onAdd){
    const inp=h('input',{type:'text',placeholder:ph,enterkeyhint:'done',autocomplete:'off','data-f':fid});
    const add=()=>{const v=inp.value.trim();if(!v)return;onAdd(v);focusFor=fid;save();draw()};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    return h('div',{class:'addr'},inp,h('button',{'aria-label':'Add',onclick:add},'+'));
  }
  function node(n,list,col){
    const root=col==null;
    if(root&&!n.c)n.c=PAL[0];
    const c=root?n.c:col;
    n.kids=n.kids||[];
    const wrap=h('div',{class:'nd'});
    const tri=h('button',{class:'tri'+(n.open?' open':''),'aria-label':'Expand',html:TRI});
    tri.addEventListener('click',()=>{n.open=!n.open;save();draw()});
    const ck=h('button',{class:'ck'+(n.on?' on':''),'aria-label':'Done'},n.on?'✓':'');
    ck.addEventListener('click',()=>{n.on=!n.on;save();draw()});
    const tx=h('div',{class:'nt'+(n.on?' done':'')},n.t);
    tx.addEventListener('click',()=>{openItem=openItem===n.id?null:n.id;draw()});
    const dn=n.kids.filter(x=>x.on).length;
    wrap.append(h('div',{class:'nr',style:'--c:'+c},tri,ck,tx,n.kids.length?h('span',{class:'cnt'},dn+'/'+n.kids.length):null));
    if(openItem===n.id){
      const pal=h('div',{class:'pal p'});
      if(root)PAL.forEach(p=>pal.append(h('button',{class:'cdot'+(p===n.c?' sel':''),style:'background:'+p,'aria-label':'Colour',onclick:()=>{n.c=p;save();draw()}})));
      const del=()=>{list.splice(list.indexOf(n),1);openItem=null;save();draw()};
      pal.append(h('button',{class:'rm',onclick:()=>n.kids.length?modal('Delete this and its sub-items?','Delete',del):del()},'Delete'));
      wrap.append(pal);
    }
    if(n.open){
      const kids=h('div',{class:'kids'});
      n.kids.forEach(x=>kids.append(node(x,n.kids,c)));
      kids.append(addRow('Add sub-item…',n.id,v=>n.kids.push({id:uid(),t:v,on:false,open:false,kids:[]})));
      wrap.append(kids);
    }
    return wrap;
  }
  function draw(){
    el.innerHTML='';
    el.append(h('h3',{},'Goals'));
    const w=wk(k);
    w.g.forEach(n=>el.append(node(n,w.g,null)));
    el.append(addRow('Add goal…','root',v=>w.g.push({id:uid(),t:v,on:false,open:false,c:PAL[w.g.length%PAL.length],kids:[]})));
    if(focusFor){const i=el.querySelector('input[data-f="'+focusFor+'"]');focusFor=null;if(i)i.focus()}
  }
  draw();
  return el;
}

/* swipe between weeks */
(function(){
  const pg=$('#pg-home');let sx=0,sy=0,ok=false;
  pg.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=!(e.target.closest&&e.target.closest('input'))},{passive:true});
  pg.addEventListener('touchend',e=>{
    if(!ok)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>80&&Math.abs(dy)<45&&Math.abs(dx)>Math.abs(dy)*2)go(dx<0?1:-1);
  },{passive:true});
})();

/* ---------- start ---------- */
renderVision();renderHome();renderExec();
show(['vision','home','execution'].includes(S.tab)?S.tab:'home');
})();
